# Netlify • AgroChain DApp (Next.js)
# O app Next.js fica em dapp/. O runtime do Next.js no Netlify (@netlify/plugin-nextjs)
# cuida das rotas, API routes e otimizações automaticamente.
# Documentação: https://docs.netlify.com/frameworks/next-js/overview/

[build]
  base = "dapp"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Endereço oficial do contrato NFT AgroChainCertNFT (Sepolia) — plataforma
  NEXT_PUBLIC_NFT_CONTRACT_ADDRESS = "0x444853d891F884EbD1b69Dc6F044a2Ff4f9C9269"
  # RPC público da Sepolia (fallback para consultas on-chain)
  NEXT_PUBLIC_SEPOLIA_RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
  # API de Compliance (IA / FastAPI). Configure a URL pública do seu backend
  # no painel do Netlify (Site settings → Environment variables) e descomente:
  # NEXT_PUBLIC_COMPLIANCE_API_URL = "https://seu-backend.exemplo.com"

# Runtime oficial do Next.js no Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers de segurança básicos (sem CSP restritiva para não quebrar o app)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
