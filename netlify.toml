[build]
  publish = "prototipo-agrochain"
  command = ""

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.infura.io https://*.alchemy.com wss://*.infura.io wss://*.alchemy.com https://sepolia.etherscan.io; img-src 'self' data: https://ipfs.io https://*.ipfs.io; font-src 'self' data:; frame-src 'none';"

[[headers]]
  for = "/src/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/app"
  to = "/AgroChain.html"
  status = 200

[[redirects]]
  from = "/certificador"
  to = "/certificador.html"
  status = 200

[[redirects]]
  from = "/web3"
  to = "/certificador.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404