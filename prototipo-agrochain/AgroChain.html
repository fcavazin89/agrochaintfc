    var bateriaMedia = Math.round(sensores.reduce(function (a, s) { return a + s.bateria; }, 0) / (sensores.length || 1));
    var confMedia = Math.round(sensores.reduce(function (a, s) { return a + IoT.qualidadeDispositivo(s.id).confiabilidade; }, 0) / (sensores.length || 1));
    var talhoesCobertos = [];
    sensores.forEach(function (s) { if (s.talhao && talhoesCobertos.indexOf(s.talhao) < 0) talhoesCobertos.push(s.talhao); });

    h += '<div class="grade g4">' +
      cartaoKPI('Dispositivos na rede', sensores.length, ativos + ' ativos · ' + sensores.filter(function (s) { return s.status === 'ATENCAO'; }).length + ' em atenção') +
      cartaoKPI('Bateria média da rede', bateriaMedia + '%', 'sensores solares e a bateria primária') +
      cartaoKPI('Confiabilidade média', confMedia + '%', 'considera bateria, sinal, calibração e falhas') +
      cartaoKPI('Leituras por dia', num(sensores.reduce(function (a, s) { return a + (1440 / s.intervaloMin); }, 0), 0), talhoesCobertos.length + ' talhões cobertos · ' + D.ancoragensIoT.length + ' ancoragens na cadeia') +
      '</div>';

    /* mapa: talhões + sensores posicionados perto do talhão deles */
    h += '<div class="cartao" style="margin-top:14px"><h2>Onde está cada sensor</h2>';
    h += '<div class="nota" style="margin-bottom:8px">Cada ponto é um dispositivo em campo. Sensores de ferramenta seguem o lote, não o talhão: o de fermentação fica no cocho e o de secagem, no terreiro.</div><div class="mapa">';
    h += '<svg viewBox="0 0 680 280" style="width:100%;height:auto">';
    for (var i = 0; i <= 11; i++) {
      h += '<line x1="' + (i * 62) + '" y1="0" x2="' + (i * 62) + '" y2="280" stroke="rgba(47,143,82,.08)"/>';
      h += '<line x1="0" y1="' + (i * 25) + '" x2="680" y2="' + (i * 25) + '" stroke="rgba(47,143,82,.08)"/>';
    }
    var talhoes = talhoesVisiveis();
    var lats = talhoes.map(function (t) { return t.geo.lat; }), lons = talhoes.map(function (t) { return t.geo.lon; });
    var latMax = Math.max.apply(null, lats), lonMin = Math.min.apply(null, lons);
    function pos(t, dLat, dLon) {
      var x = 70 + ((t.geo.lon - lonMin) * 100000) / 2.5 + (dLon || 0);
      var y = 45 + ((latMax - t.geo.lat) * 100000) / 1.55 + (dLat || 0);
      return [x, y];
    }
    /* ligações gateway → sensores */
    var gws = sensores.filter(function (s) { return s.tipo === 'gateway'; });
    sensores.forEach(function (s) {
      if (!s.talhao) return;
      var t0 = Dados.talhao(s.talhao);
      if (!t0) return;
      var gw = gws.filter(function (g) { return g.talhao === s.talhao; })[0];
      if (!gw || gw.id === s.id) return;
      var a = pos(t0, 0, 0), b = pos(t0, 26, 30);
      h += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="rgba(142,200,238,.4)" stroke-width="1" stroke-dasharray="3 3"/>';
    });
    talhoes.forEach(function (t) {
      var pt = pos(t, 0, 0);
      var cor = t.produto === 'cacau' ? '#b07d4f' : '#2f8f52';
      h += '<circle cx="' + pt[0] + '" cy="' + pt[1] + '" r="5" fill="' + cor + '"/>';
      h += '<text x="' + (pt[0] + 9) + '" y="' + (pt[1] + 4) + '" fill="#e6f4ec" font-size="11">' + t.id + ' ' + esc(t.nome.replace(/^(Talhão|Fazenda) /, '')) + ' <tspan fill="#9db2a4">' + t.area + ' ha</tspan></text>';
    });
    sensores.forEach(function (s, i) {
      if (!s.talhao) return;
      var t0 = Dados.talhao(s.talhao);
      if (!t0) return;
      var mesmo = sensores.filter(function (x) { return x.talhao === s.talhao && x.id !== s.id; });
      var idx = mesmo.indexOf(s) < 0 ? 0 : mesmo.indexOf(s) + 1;
      var pt = pos(t0, 30 + (idx % 4) * 17, 42 + Math.floor(idx / 4) * 62);
      var corS = s.status === 'ATIVO' ? (s.bateria < 60 || s.sinal < -90 ? '#e0b03a' : '#8ec8ee') : '#c0392b';
      h += '<circle cx="' + pt[0] + '" cy="' + pt[1] + '" r="6.4" fill="' + corS + '" stroke="#0b2e1c" stroke-width="1.6"/>';
      h += '<text x="' + (pt[0] + 10) + '" y="' + (pt[1] + 3.6) + '" fill="#cfe0d7" font-size="10">' + s.id + ' <tspan fill="#9db2a4">' + esc(NOME_TIPO[s.tipo].split(' ')[0]) + '</tspan></text>';
    });
    h += '</svg></div>';
    h += '<div class="flex envolve" style="margin-top:10px">' +
      legenda('#8ec8ee', 'sensor operando bem') + legenda('#e0b03a', 'sensor em atenção (bateria ou sinal)') +
      legenda('#c0392b', 'sensor com falha') + legenda('#2f8f52', 'talhão de café') + legenda('#b07d4f', 'talhão de cacau') + '</div></div>';

    /* tabela de dispositivos */
    h += '<div class="cartao" style="margin-top:14px"><h2>Inventário dos dispositivos</h2>';
    h += '<div style="overflow-x:auto"><table class="tabela"><tr><th>ID</th><th>Tipo</th><th>Instalação</th><th>Rede</th><th>Envio</th><th>Bateria</th><th>Sinal</th><th>Confiabilidade</th><th>Status</th><th></th></tr>';
    sensores.forEach(function (s) {
      var q = IoT.qualidadeDispositivo(s.id);
      var u = s.talhao ? Dados.talhao(s.talhao) : null;
      var l = s.lote ? Dados.lote(s.lote) : null;
      var corB = s.bateria < 30 ? 'vermelho' : s.bateria < 60 ? 'ouro' : 'verde';
      h += '<tr>' +
        '<td><b>' + s.id + '</b><div class="nota">' + (ICONE_TIPO[s.tipo] ? Ico.svg(ICONE_TIPO[s.tipo], 'xs') : '') + ' ' + esc(s.fabricante) + '</div></td>' +
        '<td class="nota">' + esc(NOME_TIPO[s.tipo]) + '</td>' +
        '<td class="nota">' + esc(s.local) + '<br>' + (u ? u.id + ' · ' + esc(u.nome.replace(/^(Talhão|Fazenda) /, '')) : '') + (l ? ' · lote ' + l.id : '') + '</td>' +
        '<td>' + chip(s.protocolo, s.protocolo === 'LoRaWAN' ? 'azul' : s.protocolo === 'NB-IoT' ? 'roxo' : 'cinza') + '</td>' +
        '<td class="nota">' + (s.intervaloMin < 60 ? s.intervaloMin + ' min' : (s.intervaloMin / 60) + ' h') + '</td>' +
        '<td>' + chip(s.bateria + '%', corB) + '</td>' +
        '<td class="nota">' + s.sinal + ' dBm</td>' +
        '<td style="min-width:120px">' + barra(q.confiabilidade, q.confiabilidade > 85 ? '#2f8f52' : q.confiabilidade > 65 ? '#c9a227' : '#c0392b') + '<div class="nota">' + q.confiabilidade + '% · ' + q.leiturasValidas + ' de ' + q.leiturasAnalisadas + ' leituras válidas</div></td>' +
        '<td>' + chip(s.status === 'ATIVO' ? 'Operando' : 'Em atenção', s.status === 'ATIVO' ? 'verde' : 'ouro') + '</td>' +
        '<td><button class="mini sec" onclick="App3.verSensor(\'' + s.id + '\')">Leituras </button></td></tr>';
    });
    h += '</table></div>';
    h += '<div class="nota" style="margin-top:9px">Cada intervalo de envio define o volume de dados: uma sonda que envia a cada 30 minutos gera 48 pacotes por dia; ' +
      'por isso a série bruta <b>não</b> vai toda para a blockchain — o que entra na cadeia é a raiz de Merkle do período, e cada leitura individual é conferível contra ela.</div></div>';

    /* qualidade do dado: mostra que o sistema rejeita dado ruim */
    h += '<div class="cartao" style="margin-top:14px"><h2>Controle de qualidade do dado</h2>' +
      '<div class="nota" style="margin-bottom:9px">Sensor sujo, bateria fraca, conector molhado: dado ruim <b>entra</b>. O sistema precisa barrá-lo antes que vire decisão. ' +
      'A rotina usa <b>mediana e desvio absoluto mediano (MAD)</b>, e não média e desvio-padrão, porque chuva e irrigação produzem séries naturalmente bimodais — com média, um pulso de irrigação seria descartado como “outlier”.</div>';
    var exemplo = null, exemploLacuna = null, exemploSensor = null;
    for (var j = 0; j < sensores.length; j++) {
      var sj = sensores[j], qj = IoT.leituras(sj.id, 48, { incluirQualidade: true });
      var sus = qj.filter(function (l) { return l.qualidade === 'suspeita'; })[0];
      var lac = qj.filter(function (l) { return l.qualidade === 'lacuna'; })[0];
      if (sus && !exemplo) { exemplo = sus; exemploSensor = sj.id; }
      if (lac && !exemploLacuna) exemploLacuna = lac;
      if (exemplo && exemploLacuna) break;
    }
    h += '<div class="grade g2">';
    if (exemplo) {
      h += '<div class="caixa vermelha"><b>Leitura rejeitada automaticamente</b><div class="nota" style="margin-top:6px">' +
        '<b>' + exemploSensor + '</b> · ' + dataHora(exemplo.ts) + ' · valor bruto <b>' + exemplo.valorSuspeito + '</b> para ' + esc(nomeCampo(Object.keys(exemplo.valores).filter(function (c) { return typeof exemplo.valores[c] === 'number'; })[0])) + '. ' +
        esc(exemplo.motivoQualidade) + '. O valor foi mantido na trilha com a marca de suspeito — auditoria precisa ver o que foi descartado, não só o que foi aceito.' +
        '</div></div>';
    }
    if (exemploLacuna) {
      h += '<div class="caixa ouro"><b>Lacuna de comunicação tratada</b><div class="nota" style="margin-top:6px">' +
        esc(exemploLacuna.motivoQualidade) + ' Em vez de fingir continuidade, o sistema declara a lacuna e reduz a confiabilidade do dispositivo — o comprador que consultar o lote vê exatamente o que faltou.</div></div>';
    }
    h += '</div></div>';
    return h;
  }

  function legenda(cor, texto) {
    return '<span class="flex" style="gap:6px"><span style="width:11px;height:11px;border-radius:50%;background:' + cor + ';display:inline-block"></span><span class="nota">' + texto + '</span></span>';
  }
  function cartaoKPI(rot, val, obs) {
    return '<div class="cartao"><div class="kpi"><div class="rot">' + rot + '</div><div class="val">' + val + '</div><div class="obs">' + obs + '</div></div></div>';
  }

  /* =========================== ABA 2: LEITURAS =========================== */
  function abaLeituras() {
    var sensores = sensoresVisiveis();
    var h = '';
    var d = sensores.filter(function (s) { return s.id === App3.sensorSel; })[0] || sensores[0];
    if (!d) return '<div class="cartao"><div class="nota">Nenhum sensor disponível para este perfil.</div></div>';
    App3.sensorSel = d.id;

    h += '<div class="cartao"><h2>Selecione o dispositivo</h2><div class="flex envolve" style="gap:7px;margin-top:8px">';
    sensores.forEach(function (s) {
      h += '<button class="mini ' + (s.id === d.id ? '' : 'sec') + '" onclick="App3.verSensor(\'' + s.id + '\')" title="' + esc(NOME_TIPO[s.tipo]) + '">' +
        (ICONE_TIPO[s.tipo] ? Ico.svg(ICONE_TIPO[s.tipo], 'sm') : '') + ' ' + s.id + '</button>';
    });
    h += '</div></div>';

    var serie = IoT.leituras(d.id, App3.janela, { incluirQualidade: true });
    var ult = serie[serie.length - 1];
    var q = IoT.qualidadeDispositivo(d.id);
    var u = d.talhao ? Dados.talhao(d.talhao) : null;
    var lote = d.lote ? Dados.lote(d.lote) : null;

    h += '<div class="cartao" style="margin-top:14px"><div class="flex entre" style="flex-wrap:wrap;gap:10px">' +
      '<div><b style="font-size:16px">' + (ICONE_TIPO[d.tipo] ? Ico.svg(ICONE_TIPO[d.tipo], 'sm') : '') + ' ' + d.id + ' — ' + esc(NOME_TIPO[d.tipo]) + '</b>' +
      '<div class="nota">' + esc(d.local) + (u ? ' · ' + u.id + ' ' + esc(u.nome.replace(/^(Talhão|Fazenda) /, '')) : '') + (lote ? ' · lote ' + lote.id + ' (' + esc(Dados.nomeProduto(lote.produto)) + ')' : '') + '</div></div>' +
      '<div>' + chip(d.protocolo, 'azul') + ' ' + chip('envio a cada ' + (d.intervaloMin < 60 ? d.intervaloMin + ' min' : (d.intervaloMin / 60) + ' h'), 'cinza') + ' ' +
      chip('bateria ' + d.bateria + '%', d.bateria < 60 ? 'ouro' : 'verde') + ' ' + chip(d.sinal + ' dBm', d.sinal < -90 ? 'ouro' : 'verde') + '</div></div>';
    h += '<div class="grade g4" style="margin-top:12px">';
    Object.keys(ult.valores).forEach(function (c) {
      h += '<div class="caixa"><div class="nota">' + esc(nomeCampo(c)) + '</div><b style="font-size:17px">' + num(ult.valores[c], 1) + '</b> <span class="nota">' + unidadeCampo(c) + '</span></div>';
    });
    h += '</div>';
    h += '<div class="nota" style="margin-top:9px">Leitura de ' + dataHora(ult.ts) + ' · confiabilidade do dispositivo <b>' + q.confiabilidade + '%</b> (' + esc(q.situacao) + ')</div></div>';

    /* gráfico */
    h += '<div class="cartao" style="margin-top:14px"><div class="flex entre" style="flex-wrap:wrap;gap:9px">' +
      '<h2 style="margin:0">Série temporal</h2><div>' +
      [24, 48, 168].map(function (w) {
        return '<button class="mini ' + (App3.janela === w ? '' : 'sec') + '" onclick="App3.janelaDe(' + w + ')">' + (w === 168 ? '7 dias' : w + 'h') + '</button> ';
      }).join('') + '</div></div>';
    var campos = Object.keys(ult.valores).filter(function (c) { return typeof ult.valores[c] === 'number'; });
    var campo = campos.indexOf(App3.campo) >= 0 ? App3.campo : campos[0];
    h += '<div class="flex envolve" style="gap:6px;margin:10px 0 4px">' + campos.map(function (c) {
      return '<span class="chip ' + (c === campo ? 'verde' : 'cinza') + '" style="cursor:pointer" onclick="App3.verCampo(\'' + c + '\')">' + esc(nomeCampo(c)) + '</span>';
    }).join('') + '</div>';
    h += grafico(serie, campo, d.tipo === 'sensor_fermentacao' && campo === 'tempMassa' ? { cor: '#b26a06', faixas: [{ de: 40, ate: 48, nome: 'faixa ideal de fermentação (40–48 °C)', cor: 'rgba(47,143,82,.10)' }] } :
      d.tipo === 'sensor_secagem' && campo === 'umidadeGrao' ? { cor: '#b07d4f', faixas: [{ de: 0, ate: 7.5, nome: 'ponto de secagem (≤ 7,5%)', cor: 'rgba(47,143,82,.10)' }] } : {});
    h += '<div class="flex envolve" style="margin-top:8px">' + legenda('#2f8f52', 'série aceita') + legenda('#c0392b', 'valor bruto rejeitado (plota o ponto descartado)') + legenda('#c9a227', 'lacuna de comunicação') + legenda('#e0563f', 'leitura adulterada no modo demonstração') + '</div>';
    h += '</div>';

    /* tabela de leituras com flag de qualidade */
    h += '<div class="cartao" style="margin-top:14px"><h2>Últimas 12 leituras recebidas</h2><div style="overflow-x:auto">';
    h += '<table class="tabela"><tr><th>Horário</th>';
    campos.slice(0, 5).forEach(function (c) { h += '<th>' + esc(nomeCampo(c)) + '</th>'; });
    h += '<th>Qualidade</th></tr>';
    serie.slice(-12).reverse().forEach(function (x) {
      var cor = x.qualidade === 'lacuna' ? 'ouro' : x.qualidade === 'suspeita' ? 'vermelho' : x.adulterada ? 'vermelho' : 'verde';
      var txt = x.qualidade === 'lacuna' ? 'lacuna tratada' : x.qualidade === 'suspeita' ? 'rejeitada' : x.adulterada ? 'alterada' : 'válida';
      h += '<tr><td class="nota">' + dataHora(x.ts) + '</td>';
      campos.slice(0, 5).forEach(function (c) { h += '<td>' + num(x.valores[c], 1) + '<span class="nota"> ' + unidadeCampo(c) + '</span></td>'; });
      h += '<td>' + chip(txt, cor) + (x.qualidade === 'suspeita' ? '<div class="nota">bruto: ' + x.valorSuspeito + '</div>' : '') + '</td></tr>';
    });
    h += '</table></div>';

    if (podeAncorar()) {
      h += '<div class="flex" style="gap:9px;margin-top:12px;flex-wrap:wrap">' +
        '<button class="mini" onclick="App3.ancorarAgora(\'' + d.id + '\')">Ancorar ' + App3.janela + 'h de leituras na blockchain</button>' +
        '<button class="mini sec" onclick="App3.ir(\'ancoragem\')">Ver ancoragens existentes </button></div>';
    } else {
      h += '<div class="caixa" style="margin-top:12px"><b>Perfil "' + usuario().papel + '": leitura permitida.</b> <span class="nota">Quem ancora leituras é o produtor dono do sensor ou a cooperativa que opera o gateway — assim ninguém escolhe depois o que registra sobre o outro.</span></div>';
    }
    h += '</div>';
    return h;
  }

  /* =========================== ABA 3: DERIVADOS =========================== */
  function abaDerivados() {
    var h = '';
    var talhoes = talhoesVisiveis();
    var loteSel = App3.loteSelIoT;
    var lotesDerivaveis = lotesVisiveis().filter(function (l) {
      return IoT.sensoresDeLote(l.id).length > 0;
    });
    if (!loteSel || !lotesDerivaveis.filter(function (l) { return l.id === loteSel; })[0]) loteSel = lotesDerivaveis.length ? lotesDerivaveis[0].id : null;

    h += '<div class="cartao"><h2>O que o dado bruto vira: indicadores agronômicos</h2>' +
      '<div class="nota" style="margin-bottom:10px">Nenhuma decisão sai de “temperatura = 31,2 °C”. Sai de graus-dia acumulado, de saldo hídrico e de índice de fermentação — ' +
      'cada um com uma fórmula publicada, para que o agrônomo possa discordar com argumento.</div>';
    h += '<div class="grade g2">';
    talhoes.forEach(function (t) {
      var der = IoT.derivadosTalhao(t.id);
      var prod = D.usuarios.filter(function (x) { return x.id === t.produtor; })[0];
      h += '<div class="caixa"><div class="flex entre"><b>' + t.id + ' · ' + esc(t.nome.replace(/^(Talhão|Fazenda) /, '')) + '</b>' + chip(esc(Dados.nomeProduto(t.produto)), t.produto === 'cacau' ? 'ouro' : 'verde') + '</div>';
      h += '<div class="nota" style="margin:5px 0 9px">' + esc(prod.municipio) + ' · ' + t.area + ' ha · ' + esc(t.cultivar) + ' · ' + esc(t.sistema) + '</div>';
      h += '<table class="tabela" style="font-size:12px">';
      h += linhaDer('Graus-dia acumulados', num(der.grausDia.acumulado30d, 0) + ' GD/30 dias', 'ciclo: ' + num(der.grausDia.acumuladoCiclo, 0) + ' GD · ' + esc(der.grausDia.estagio));
      if (der.balanco) {
        h += linhaDer('Balanço hídrico', num(der.balanco.saldo, 1) + ' mm em 30 dias', 'chuva ' + num(der.balanco.chuva, 0) + ' + irrigação ' + num(der.balanco.irrigacao, 0) + ' − ET real ' + num(der.balanco.etReal, 0) + ' mm · ' + esc(der.balanco.classificacao));
        h += linhaDer('Água no solo', der.estresse ? der.estresse.aguaDisponivel + '% da capacidade' : '—', der.estresse ? 'VWC 10/30/60 cm: ' + der.estresse.vwc10 + '/' + der.estresse.vwc30 + '/' + der.estresse.vwc60 + '% · tendência 48h: ' + der.estresse.tendencia48h + ' pontos' : 'déficit severo de sonda: sem medição direta');
      } else {
        h += linhaDer('Balanço hídrico', 'sem medição', 'nenhuma sonda de solo neste talhão — o balanço depende de medição para ser auditável');
      }
      if (der.molhamento) {
        h += linhaDer('Molhamento foliar', der.molhamento.horasMolhadas + ' h molhadas em 7 dias', der.molhamento.horasFavoraveis + ' h em faixa favorável a doença · ' + esc(der.molhamento.fonte));
      }
      if (der.irrigacao) {
        h += linhaDer('Cobertura hídrica 7 dias', der.irrigacao.coberturaEt0Pct + '% da ET0', esc(der.irrigacao.situacao) + ' · irrigado ' + der.irrigacao.aplicado7d + ' mm + chuva ' + der.irrigacao.chuva7d + ' mm');
      }
      h += '</table>';
      h += '<button class="mini sec" style="margin-top:9px" onclick="App3.verLavoura(\'' + t.id + '\')">Abrir lavoura e IA </button></div>';
    });
    h += '</div></div>';

    /* fermentação e secagem: indicadores com impacto direto no preço */
    h += '<div class="cartao" style="margin-top:14px"><h2>Fermentação e secagem: onde o lote ganha ou perde valor</h2>' +
      '<div class="nota" style="margin-bottom:9px">Duas falhas de pós-colheita explicam boa parte do desconto no cacau e no café fino: fermentação mal conduzida e secagem descontrolada. ' +
      'Estes indicadores acompanham o lote em tempo real e apontam o momento da viragem.</div>';
    if (!lotesDerivaveis.length) {
      h += '<div class="caixa ouro">Nenhum lote deste perfil tem sensor de fermentação ou secagem dedicado.</div>';
    } else {
      h += '<div class="flex envolve" style="gap:7px;margin-bottom:10px">' + lotesDerivaveis.map(function (l) {
        return '<button class="mini ' + (l.id === loteSel ? '' : 'sec') + '" onclick="App3.verLote(\'' + l.id + '\')">' + l.id + ' · ' + esc(Dados.nomeProduto(l.produto)) + '</button>';
      }).join('') + '</div>';

      var f = IoT.fermentacao(loteSel);
      var s = IoT.secagem(loteSel);
      h += '<div class="grade g2">';
      if (f) {
        var corClasse = f.classe.indexOf('IDEAL') >= 0 ? 'verde' : f.classe.indexOf('EXCESSO') >= 0 ? 'ouro' : 'vermelho';
        h += '<div class="caixa"><div class="flex entre"><b>Fermentação — lote ' + f.lote + '</b>' +
          chip(f.classe + (f.encerrada ? ' · encerrada' : ' · em andamento'), corClasse) + '</div>';
        h += '<div class="grade g4" style="margin:10px 0">' +
          '<div><div class="nota">Horas desde o início</div><b>' + num(f.horasMonitoradas, 0) + ' h</b><div class="nota">fase: ' + esc(f.fase) + '</div></div>' +
          '<div><div class="nota">Calor acumulado (T > 40 °C)</div><b>' + num(f.indiceAcumulado, 0) + ' °C·h</b><div class="nota">medido até agora</div></div>' +

  /* =========================== ABA 5: ALERTAS =========================== */
  function abaAlertas() {

      '<div class="nota" style="margin-bottom:11px">Dois tipos: <b>alerta de dispositivo</b> (bateria, sinal, calibração, leitura rejeitada) e <b>alerta agronômico</b> (condição medida que favorece doença, ' +

       ['Umidade do lote na entrega', 'Umidade do grão medida no terreiro e no recebimento',
       'Divergência de peso por umidade na indústria é conferida contra a medição do produtor: some a discussão de “o lote secou no caminho”.']].forEach(function (x) {
      h += '<tr><td><b>' + esc(x[0]) + '</b></td><td class="nota">' + esc(x[1]) + '</td><td class="nota">' + esc(x[2]) + '</td></tr>';

    if (!r) { App3.aviso = 'Não há leituras para ancorar neste dispositivo.'; App.render(); return; }

      App.render();

    App3.aviso = 'Ancoradas ' + r.preparacao.leituras + ' leituras de ' + dispId + ' no bloco #' + r.bloco.indice +
      ' — raiz de Merkle ' + r.preparacao.raizMerkle.slice(0, 16) + '… · transação ' + r.transacao.id + ' confirmada.';

    App3.prova = IoT.provarLeitura(ancId);

    compra: { item: '', qtd: '2', preco: '', fornecedor: '', prazo: '30' },
    aplicacao: { item: '', qtd: '0,5', talhao: '' },
    venda: { lote: '', qtd: '', preco: '', comprador: '', prazo: '30' },
    preparo: null,
    ancoragem: null,
    prova: null,
    maquinaSel: null,
    aviso: null,
    avisoTipo: 'verde'
  };

  /* ---------------- utilidades ---------------- */
  function num(v, d) { if (v === null || v === undefined || isNaN(v)) return '—'; return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 0 : d }); }
  function brl(v, d) { if (v === null || v === undefined || isNaN(v)) return '—'; return 'R$ ' + num(v, d === undefined ? 2 : d); }
  function pct(v, d) { if (v === null || v === undefined || isNaN(v)) return '—'; return num(v, d === undefined ? 1 : d) + '%'; }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function mesBR(mm) { var p = mm.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][Number(p[1]) - 1] + '/' + p[0].slice(2); }
  function dataBR(iso) { if (!iso) return '—'; var p = iso.slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function sinal(v) { return v > 0 ? 'positivo' : v < 0 ? 'negativo' : ''; }
  function chip(t, cor) { return '<span class="chip ' + (cor || 'cinza') + '">' + esc(t) + '</span>'; }
  function barra(p, cor) {
    var v = Math.max(0, Math.min(100, p || 0));
    var grad = cor ? 'background:' + cor : '';
    return '<div class="barra-alt" style="min-width:70px"><i style="width:' + v.toFixed(0) + '%;' + grad + '"></i></div>';
  }
  function kpi(rot, val, obs, cor) {
    return '<div class="kpi"><div class="rot">' + rot + '</div><div class="val ' + (cor === 'pequeno' ? 'pequeno' : '') + '"' +
      (cor && cor !== 'pequeno' ? ' style="color:' + cor + '"' : '') + '>' + val + '</div>' + (obs ? '<div class="obs">' + obs + '</div>' : '') + '</div>';
  }
  function cartao(titulo, corpo, classe) {
    return '<div class="cartao ' + (classe || '') + '">' + (titulo ? '<h2>' + titulo + '</h2>' : '') + corpo + '</div>';
  }
  function fonte(texto) { return '<div class="nota" style="margin-top:8px;border-top:1px solid var(--linha);padding-top:7px">ⓘ ' + texto + '</div>'; }
  function corSeveridade(s) { return s === 'critico' ? 'vermelho' : s === 'atencao' ? 'ouro' : 'cinza'; }

  /* ---------------- toasts ---------------- */
  function toast(mensagem, tipo) {
    if (typeof document === 'undefined') return;
    var caixa = document.getElementById('toasts');
    if (!caixa) return;
    var el = document.createElement('div');
    el.className = 'toast ' + (tipo || '');
    el.innerHTML = mensagem;
    caixa.appendChild(el);
    global.setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 5200);
    global.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 5800);
  }
  function avisar(msg, tipo) { toast(msg, tipo || 'verde'); App4.renderAba(); }

  /* ---------------- navegação ---------------- */
  App4.ir = function (aba) { App4.aba = aba; App4.aviso = null; global.App.render(); };
  App4.verTalhao = function (id) { App4.talhao = id; App4.aba = 'custos'; global.App.render(); };
  App4.filtrarTitulo = function (f) { App4.filtroTitulo = f; global.App.render(); };
  App4.filtrarMov = function (f) { App4.filtroMov = f; global.App.render(); };
  App4.renderAba = function () { if (global.App.view === 'erp') global.App.render(); };
  App4.limpar = function () { App4.preparo = null; App4.prova = null; App4.ancoragem = null; global.App.render(); };

  /* =====================================================================
   * CASCA — cabeçalho, abas e roteamento interno
   * =================================================================== */
  App4.viewErp = function () {
    var escopo = E.escopoAtual();
    var al = E.alertas();
    var ind = E.indicadores();
    var abas = [
      { id: 'visao', n: 'Visão geral' },
      { id: 'financeiro', n: 'Financeiro', badge: ind.vencidos || null },
      { id: 'custos', n: 'Custos e safra' },
      { id: 'estoque', n: 'Estoques', badge: ind.estoqueAbaixoMinimo || null },
      { id: 'operacoes', n: 'Pessoas e máquinas' },
      { id: 'fechamento', n: 'Fechamento contábil' }
    ];
    var html = '<h2>ERP da propriedade ' +
      chip(escopo.tipo === 'PROPRIO' ? 'minha propriedade' : 'visão consolidada', escopo.tipo === 'PROPRIO' ? 'verde' : 'roxo') +
      chip(al.criticos + ' críticos de ' + al.total + ' alertas', al.criticos ? 'vermelho' : 'verde') + '</h2>';
    html += '<div class="sub" style="margin-bottom:10px">' + esc(escopo.rotulo || 'Cadastro, custo, caixa e estoque com a mesma origem de dado: o evento da cadeia. Nada é digitado duas vezes.') + '</div>';
    html += '<div class="abas">' + abas.map(function (a) {
      return '<div class="aba ' + (App4.aba === a.id ? 'on' : '') + '" onclick="App4.ir(\'' + a.id + '\')">' + a.n +
        (a.badge ? '<span class="badge">' + a.badge + '</span>' : '') + '</div>';
    }).join('') + '</div>';

    if (App4.aviso) html += '<div class="caixa ' + (App4.avisoTipo === 'vermelho' ? '' : 'verde') + '" style="margin-bottom:12px">' + App4.aviso + '</div>';

    if (App4.aba === 'visao') html += viewVisao();
    else if (App4.aba === 'financeiro') html += viewFinanceiro();
    else if (App4.aba === 'custos') html += viewCustos();
    else if (App4.aba === 'estoque') html += viewEstoque();
    else if (App4.aba === 'operacoes') html += viewOperacoes();
    else html += viewFechamento();
    return html;
  };

  /* =====================================================================
   * VISÃO GERAL
   * =================================================================== */
  function viewVisao() {
    var ind = E.indicadores();
    var d = E.dre({});
    var c = E.custosConsolidados();
    var est = E.estoqueAtual({});
    var al = E.alertas();

    var pe = ind.pontoEquilibrio;
    var html = '';

    html += '<div class="grade g4">';
    html += cartao('', kpi('Resultado do período', brl(ind.resultado, 0), d.periodo + ' · margem líquida de ' + pct(ind.margemLiquida), ind.resultado >= 0 ? 'var(--positivo)' : 'var(--negativo)'));
    html += cartao('', kpi('Receita líquida', brl(ind.receita, 0), 'custo de produção consome ' + num(ind.custoPorReal * 100, 0) + ' centavos de cada real'));
    html += cartao('', kpi('Margem bruta da lavoura', pct(ind.margemBruta), 'após tributos e custo de produção'));
    html += cartao('', kpi('Custo por hectare', brl(ind.custoPorHa, 0), num(ind.area, 1) + ' ha produtivos sob gestão'));
    html += '</div>';

    html += '<div class="grade g4" style="margin-top:14px">';
    html += cartao('', kpi('Caixa (12 meses)', brl(ind.saldoCaixa, 0), 'partiu de ' + brl(E.fluxoCaixa({}).saldoInicial, 0)));
    html += cartao('', kpi('A receber', brl(ind.aReceber, 0), ind.vencidos ? (ind.vencidos + ' título(s) vencido(s): ' + brl(ind.vencidosValor, 0)) : 'nenhum título vencido'));
    html += cartao('', kpi('Estoque', brl(ind.estoque, 0), 'produto ' + brl(ind.estoqueProduto, 0) + ' + insumos ' + brl(ind.estoqueInsumo, 0)));
    html += cartao('', kpi('Ponto de equilíbrio', pct(pe.coberturaPct, 0) + ' coberto', 'meta de ' + num(pe.sacasEquivalentes, 0) + ' sacas equivalentes: ' + brl(pe.receitaNecessaria, 0)));
    html += '</div>';

    /* gráficos principais */
    html += '<div class="grade g2" style="margin-top:14px">';
    var meses = d.meses.map(function (m) { return mesBR(m.mes); });
    html += cartao('Receita e custo por mês (últimos 12 meses)',

        { nome: 'Entradas (vendas)', dados: d.meses.map(function (m) { return m.receita; }), cor: Graf.CORES.verde },
        { nome: 'Saídas (custo e despesa)', dados: d.meses.map(function (m) { return m.custo; }), cor: Graf.CORES.cacau }
      ], { formato: function (v) { return Graf.compacto(v); }, unidade: 'R$', sufixo: '', altura: 240 }) + '</div>' +
      '<div class="legenda"><span><i style="background:' + Graf.CORES.verde + '"></i>Entradas</span><span><i style="background:' + Graf.CORES.cacau + '"></i>Saídas</span></div>' +
      fonte('Barras agrupadas do resultado mês a mês. O caixa da fazenda é sazonal: a colheita concentra a saída e o recebimento vem 30 a 60 dias depois da venda.'));
    var acumulado = 0;
    var linhaAcum = d.meses.map(function (m) { acumulado += m.resultado; return acumulado; });
    html += cartao('Resultado acumulado no período',
      '<div class="graf">' + Graf.area([{ nome: 'Resultado acumulado', dados: linhaAcum, cor: Graf.CORES.ouro }], {
        formato: function (v) { return 'R$ ' + Graf.compacto(v); }, unidade: 'R$', baseZero: true, altura: 240,
        rotuloX: [mesBR(d.meses[0].mes), mesBR(d.meses[d.meses.length - 1].mes)]
      }) + '</div>' + fonte('Soma corrida do resultado: mostra em que mês a safra vira lucro e quanto do ano depende das vendas do segundo semestre.'));
    html += '</div>';

    html += '<div class="grade g2" style="margin-top:14px">';
    html += cartao('De onde vem o resultado (cascata da DRE)',

      fonte('A cascata parte da receita bruta e desconta tributos, custo de produção, despesas, depreciação e juros até o resultado do período.'));
    html += cartao('Composição do custo de produção',
      '<div class="flex envolve" style="gap:18px;align-items:center">' +
      Graf.rosca(d.contas.custos.slice(0, 5).map(function (x) { return { nome: x.nome, valor: x.valor }; }),
        { formato: function (v) { return 'R$ ' + Graf.compacto(v); }, centro: 'R$ ' + Graf.compacto(d.custoProducao), centroRotulo: 'custo do período', unidade: 'R$' }) +
      '<div style="flex:1;min-width:240px">' + d.contas.custos.slice(0, 5).map(function (x, i) {
        return '<div class="flex entre" style="padding:5px 0;border-bottom:1px solid var(--linha)"><span class="nota">' + esc(x.nome) + '</span><b>' + brl(x.valor, 0) + '</b></div>';
      }).join('') + '</div></div>' +
      fonte('As cinco contas que mais pesam no custo de produção. Cada centavo vem de lançamento do ERP — compra de insumo, baixa de estoque, folha ou serviço de máquina.'));
    html += '</div>';

    /* talhões */
    html += '<div class="cartao" style="margin-top:14px"><h2>Custo, preço e margem por talhão ' + chip('clique em um talhão para abrir a ficha completa', 'cinza') + '</h2>';
    html += '<div style="overflow-x:auto"><table class="tabela"><thead><tr>' +
      '<th>Talhão</th><th>Área</th><th class="num">Custo total</th><th class="num">Custo por ' + 'saca/arroba' + '</th><th class="num">Preço de mercado</th><th class="num">Preço do lote (IA)</th><th>Margem</th><th>Safra</th><th></th>' +
      '</tr></thead><tbody>';
    c.talhoes.forEach(function (t) {
      var cor = t.margemPct >= 25 ? 'verde' : t.margemPct >= 10 ? 'ouro' : 'vermelho';
      html += '<tr><td><b>' + esc(t.nome) + '</b><div class="nota">' + esc(t.produtoRotulo) + ' · ' + esc(t.cultivar) + ' · ' + t.idade + ' anos · ' + esc(t.sistema) + '</div></td>' +
        '<td>' + num(t.area, 1) + ' ha</td>' +
        '<td class="num">' + brl(t.custoTotal, 0) + '<div class="nota">' + brl(t.custoPorHa, 0) + '/ha</div></td>' +
        '<td class="num">' + brl(t.custoSacaProjetado, 0) + '<div class="nota">' + esc(t.unidadeNome) + '</div></td>' +
        '<td class="num">' + brl(t.precoMercado, 0) + '</td>' +
        '<td class="num">' + (t.precoPremium ? brl(t.precoPremium, 0) + '<div class="nota">lote ' + esc(t.loteRef) + '</div>' : '—') + '</td>' +
        '<td>' + chip(pct(t.margemPct, 1), cor) + (t.margemPremiumPct !== null && t.precoPremium ? '<div class="nota">com o lote: ' + pct(t.margemPremiumPct, 1) + '</div>' : '') + '</td>' +
        '<td style="min-width:90px">' + barra(t.progressoSafraPct) + '<div class="nota">' + num(t.progressoSafraPct, 0) + '% de ' + num(t.unidadesPrevistas, 0) + ' ' + esc(t.unidadeNome.split(' ')[0]) + '</div></td>' +
        '<td><button class="mini sec" onclick="App4.verTalhao(\'' + t.talhao + '\')">abrir</button></td></tr>';
    });
    html += '</tbody></table></div>' + fonte('Custo dividido pela produção prevista pelo modelo de IA: se a lavoura render menos que o previsto, o custo por saca sobe na hora — é o mesmo número que o assistente usa para responder.') + '</div>';

    /* estoque + alertas */
    html += '<div class="grade g2" style="margin-top:14px">';
    html += cartao('Estoque de produto rastreado, lote a lote',
      lotes.length ? '<div style="overflow-x:auto"><table class="tabela compacta"><thead><tr><th>Lote</th><th>Produto</th><th class="num">Saldo</th><th class="num">Custo</th><th class="num">Preço da IA</th><th class="num">Margem</th></tr></thead><tbody>' +
        lotes.map(function (l) {
          return '<tr><td><b>' + esc(l.lote) + '</b><div class="nota">' + esc(l.talhao || '') + '</div></td>' +
            '<td>' + esc(l.produtoRotulo) + '<div class="nota">' + esc(l.statusCadeia || '') + '</div></td>' +
            '<td class="num">' + num(l.saldo, 0) + '<div class="nota">' + esc(l.unidade) + '</div></td>' +
            '<td class="num">' + brl(l.custoUnit, 0) + '</td>' +
            '<td class="num">' + brl(l.precoIA, 0) + '<div class="nota">nota ' + num(l.notaQualidade, 0) + ' · ' + (l.ajustePct > 0 ? '+' : '') + num(l.ajustePct, 1) + '%</div></td>' +
            '<td class="num ' + sinal(l.margemPct) + '">' + pct(l.margemPct, 1) + '<div class="nota">' + brl(l.resultado, 0) + '</div></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="caixa" style="margin-top:10px">Total disponível para venda: <b>' + brl(est.valorProduto, 0) + '</b> a preço de custo e <b>' + brl(lotes.reduce(function (a, l) { return a + l.valorMercado; }, 0), 0) + '</b> ao preço que o modelo de IA devolve para a qualidade de cada lote.</div>'

          '<div class="flex entre envolve" style="gap:8px"><b>' + esc(a.titulo) + '</b>' + chip(a.area, corSeveridade(a.severidade)) + '</div>' +
          '<div class="nota" style="margin-top:5px">' + esc(a.detalhe) + '</div>' +

      }).join('') + (al.itens.length > 9 ? '<div class="nota">e mais ' + (al.itens.length - 9) + ' alertas nas outras abas.</div>' : '') : Graf.vazio('Sem alertas no período'));
    html += '</div>';

    /* heatmap de custo */
    html += '<div class="cartao" style="margin-top:14px"><h2>Custo por hectare, talhão a talhão e mês a mês</h2>' +
      '<div class="graf">' + heatmapCusto() + '</div>' +
      fonte('Mancha de calor do custo por hectare em cada mês. Serve para ver onde o dinheiro entra: adubação de outubro a abril, colheita de maio a outubro e a manutenção de máquinas em abril e outubro.') + '</div>';
    return html;
  }

  function heatmapCusto() {
    var talhoes = E.custosConsolidados().talhoes;
    var meses = E.MESES();
    var linhas = talhoes.map(function (t) { return t.talhao + ' ' + t.nome.slice(0, 14); });
    var cols = meses.map(function (m) { return mesBR(m); });
    var valores = talhoes.map(function (t) {
      return meses.map(function (m) {
        var ls = E.lancamentos({ talhao: t.talhao, de: m + '-01', ate: m + '-31' });
        var v = ls.reduce(function (a, l) { return a + l.valor; }, 0);
        return Math.round(v / t.area);
      });
    });
    return Graf.heatmap(linhas, cols, valores, { formato: function (v) { return 'R$ ' + Graf.compacto(v); }, unidade: '/ha', celula: 46, nota: 'Custo direto lançado no talhão (sem rateio da estrutura), dividido pela área.' });
  }

        faixas: [{ de: -1e9, ate: 0, nome: 'caixa negativo', cor: 'rgba(192,57,43,.14)' }]
      }) + '</div>' +
      '<div class="nota">Saldo inicial de ' + brl(fc.saldoInicial, 0) + ' e saldo atual de <b>' + brl(fc.saldoFinal, 0) + '</b>. O mês corrente (' + mesBR(E.MESES()[E.MESES().length - 1]) + ') está incompleto e aparece como parcial.</div>', 'destaque');
    html += cartao('Projeção de 90 dias e estoque disponível',
      '<div class="graf">' + Graf.barras(proj.janelas.map(function (j) { return j.rotulo; }), [
        { nome: 'A receber', dados: proj.janelas.map(function (j) { return j.aReceber; }), cor: Graf.CORES.verde },
        { nome: 'A pagar + custeio', dados: proj.janelas.map(function (j) { return -(j.aPagar + j.custeio); }), cor: Graf.CORES.cacau }
      ], { formato: function (v) { return Graf.compacto(v); }, unidade: 'R$', altura: 200 }) + '</div>' +
      '<table class="tabela compacta" style="margin-top:8px"><thead><tr><th>Janela</th><th class="num">A receber</th><th class="num">A pagar</th><th class="num">Custeio estimado</th><th class="num">Saldo projetado</th></tr></thead><tbody>' +

          '<td class="num ' + sinal(j.saldo) + '"><b>' + brl(j.saldo, 0) + '</b></td></tr>';
      }).join('') + '</tbody></table>' +
      (proj.alerta ? '<div class="caixa" style="margin-top:9px;border-left:3px solid var(--critico)">' + esc(proj.alerta) + '</div>' : '<div class="caixa verde" style="margin-top:9px">✓ Caixa projetado positivo nas três janelas. Fôlego estimado: ' + num(proj.mesesDeFolego, 1) + ' meses de custeio coberto por caixa e estoque.</div>') +
      '<h3 style="margin-top:12px">Estoque que pode virar caixa hoje</h3>' +
      (proj.disponivel.length ? '<table class="tabela compacta"><thead><tr><th>Lote</th><th class="num">Saldo</th><th class="num">Custo</th><th class="num">Preço da IA</th><th class="num">Líquido</th><th class="num">Margem</th></tr></thead><tbody>' +
        proj.disponivel.map(function (x) {

            '<td class="num">' + brl(x.custoUnit, 0) + '</td><td class="num">' + brl(x.precoUnit, 0) + '<div class="nota">nota ' + num(x.notaQualidade, 0) + '</div></td>' +

    var pagar = tit.filter(function (t) { return t.tipo === 'PAGAR'; });

      '<span class="sub">' + receber.length + ' a receber · ' + pagar.length + ' a pagar</span></h2>';
    html += '<div class="flex envolve" style="margin-bottom:9px">' +
      ['todos', 'ABERTO', 'VENCIDO', 'RECEBIDO', 'PAGO'].map(function (f) {
        return '<span class="chip filtro ' + (filtro === f ? 'on' : '') + '" onclick="App4.filtrarTitulo(\'' + f + '\')">' + (f === 'todos' ? 'todos' : f.toLowerCase()) + '</span>';
      }).join('') + '</div>';
    html += '<div class="grade g2">';
    html += '<div><h3>Contas a receber</h3><div style="overflow-x:auto"><table class="tabela compacta"><thead><tr><th>Contraparte</th><th class="num">Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead><tbody>' +
      receber.filter(passa).map(function (t) {
        return '<tr><td>' + esc(t.contraparte) + '<div class="nota">' + esc(t.descricao.slice(0, 68)) + (t.contrato ? ' · ' + esc(t.contrato) : '') + '</div>' +
          (t.origem === 'ESCROW' ? '<span class="tag">escrow</span>' : '') + '</td>' +
          '<td class="num">' + brl(t.valor, 0) + '</td><td>' + dataBR(t.vencimento) + '</td>' +
          '<td>' + chip(t.status === 'RECEBIDO' ? 'recebido' : t.status === 'VENCIDO' ? 'vencido' : 'aberto', t.status === 'RECEBIDO' ? 'verde' : t.status === 'VENCIDO' ? 'vermelho' : 'ouro') + '</td>' +
          '<td>' + (t.status === 'RECEBIDO' ? '' : '<button class="mini sec" onclick="App4.liquidar(\'' + t.id + '\')">liquidar</button>') + '</td></tr>';
      }).join('') || '<tr><td colspan="5">' + Graf.vazio('Nenhum título neste filtro') + '</td></tr>';
    html += '</tbody></table></div></div>';
    html += '<div><h3>Contas a pagar</h3><div style="overflow-x:auto"><table class="tabela compacta"><thead><tr><th>Contraparte</th><th class="num">Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead><tbody>' +
      pagar.filter(passa).map(function (t) {
        return '<tr><td>' + esc(t.contraparte) + '<div class="nota">' + esc(t.descricao.slice(0, 68)) + '</div></td>' +
          '<td class="num">' + brl(t.valor, 0) + '</td><td>' + dataBR(t.vencimento) + '</td>' +
          '<td>' + chip(t.status === 'PAGO' ? 'pago' : t.status === 'VENCIDO' ? 'vencido' : 'aberto', t.status === 'PAGO' ? 'verde' : t.status === 'VENCIDO' ? 'vermelho' : 'ouro') + '</td>' +
          '<td>' + (t.status === 'PAGO' ? '' : '<button class="mini sec" onclick="App4.liquidar(\'' + t.id + '\')">pagar</button>') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    html += '</div>';
    html += '<div class="flex envolve" style="margin-top:11px;gap:9px">' +
      '<button class="roxo" onclick="App4.sincronizarEscrow()">Sincronizar contratos em escrow com o contas a receber</button>' +
      '<span class="nota">Contrato com pagamento em escrow entra no contas a receber com o banco de custódia identificado; quando a etapa de liberação é concluída na cadeia, o título é baixado.</span></div>';
    html += '</div>';

    /* DRE + orçado */
    html += '<div class="grade g2" style="margin-top:14px">';
    html += cartao('DRE do período — ' + esc(d.periodo),
      '<table class="tabela compacta"><tbody>' +
      linhaDre('Receita bruta', d.receitaBruta, false) +
      linhaDre('(−) Tributos sobre a venda', -d.tributos, false) +
      linhaDre('= Receita líquida', d.receitaLiquida, true) +
      linhaDre('(−) Custo de produção', -d.custoProducao, false) +
      linhaDre('= Margem bruta (' + pct(d.margemBrutaPct) + ')', d.margemBruta, true) +
      linhaDre('(−) Despesas operacionais', -d.despesas, false) +
      linhaDre('(−) Depreciação', -d.depreciacao, false) +
      linhaDre('= Resultado operacional', d.resultadoOperacional, true) +
      linhaDre('(−) Despesas financeiras', -d.financeiras, false) +
      linhaDre('= Resultado do período (' + pct(d.margemLiquidaPct) + ')', d.resultado, true) +
      '</tbody></table>' +
      '<h3 style="margin-top:12px">Cinco maiores contas de custo</h3>' +
      d.contas.custos.slice(0, 5).map(function (x) {
        return '<div class="flex entre" style="padding:4px 0"><span class="nota">' + esc(x.codigo + ' ' + x.nome) + '</span><b>' + brl(x.valor, 0) + '</b></div>';
      }).join('') + fonte('A DRE é montada por grupo de conta do plano de contas; receita e custo saem dos mesmos lançamentos que alimentam o fluxo de caixa.'),
      'claro');
    html += cartao('Orçado × realizado de ' + orc.ano + ' (' + orc.progressoAnoPct + '% do ano decorrido)',
      '<div class="graf">' + Graf.barras(orc.linhas.map(function (l) { return l.nome.replace(' planejada', '').slice(0, 22); }), [
        { nome: 'Orçado', dados: orc.linhas.map(function (l) { return l.planejado; }), cor: Graf.CORES.ref },
        { nome: 'Realizado', dados: orc.linhas.map(function (l) { return l.realizado; }), cor: Graf.CORES.verde }
      ], { formato: function (v) { return Graf.compacto(v); }, unidade: 'R$', altura: 210 }) + '</div>' +
      '<table class="tabela compacta" style="margin-top:8px"><thead><tr><th>Grupo</th><th class="num">Orçado</th><th class="num">Realizado</th><th class="num">Atingido</th><th>Situação</th></tr></thead><tbody>' +
      orc.linhas.map(function (l) {
        var cor = l.ehReceita ? (l.atingimentoPct >= orc.progressoAnoPct ? 'verde' : 'ouro') : (l.atingimentoPct <= orc.progressoAnoPct * 1.02 ? 'verde' : l.atingimentoPct <= orc.progressoAnoPct * 1.15 ? 'ouro' : 'vermelho');
        return '<tr><td>' + esc(l.nome) + '<div class="nota">' + esc(l.grupo) + (l.meta ? ' · ' + esc(l.meta) : '') + '</div></td>' +
          '<td class="num">' + brl(l.planejado, 0) + '</td><td class="num">' + brl(l.realizado, 0) + '</td>' +
          '<td class="num">' + pct(l.atingimentoPct, 0) + '</td><td>' + chip(l.situacao, cor) + '</td></tr>';
      }).join('') + '</tbody></table>' +
      fonte('O orçamento parte do histórico anualizado com metas declaradas: 4% de redução no custo da lavoura, estrutura mantida com a inflação e 6% de crescimento na receita com prêmio de qualidade.'));
    html += '</div>';
    return html;
  }
  function linhaDre(nome, valor, forte) {
    return '<tr' + (forte ? ' class="total"' : '') + '><td>' + esc(nome) + '</td><td class="num ' + (!forte ? sinal(valor) : '') + '" style="width:150px"><b>' + brl(valor, 0) + '</b></td></tr>';
  }

  /* =====================================================================
   * CUSTOS E SAFRA

  function viewCustos() {

    html += cartao('', kpi('Custo de produção no período', brl(c.custoTotal, 0), num(c.area, 1) + ' ha sob gestão'));
    html += cartao('', kpi('Custo médio por hectare', brl(c.custoPorHa, 0), 'inclui rateio da estrutura por área'));
    html += cartao('', kpi('Talhões abaixo de 10% de margem', num(c.criticos.length, 0), c.criticos.length ? 'revisar: ' + c.criticos.join(', ') : 'todos com margem saudável', c.criticos.length ? 'var(--negativo)' : 'var(--positivo)'));
    html += cartao('', kpi('Talhões monitorados', num(c.talhoes.length, 0), 'custo, produção e preço lote a lote'));
    html += '</div>';

    html += cartao('Custo por unidade produzida × preço que o mercado paga',
      '<div class="graf">' + Graf.barras(c.talhoes.map(function (t) { return t.talhao + ' ' + t.unidadeNome.slice(0, 10); }), [
        { nome: 'Custo por unidade (projetado com a IA)', dados: c.talhoes.map(function (t) { return t.custoSacaProjetado; }), cor: Graf.CORES.cacau },
        { nome: 'Preço de mercado', dados: c.talhoes.map(function (t) { return t.precoMercado; }), cor: Graf.CORES.verde },
        { nome: 'Preço do lote rastreado', dados: c.talhoes.map(function (t) { return t.precoPremium; }), cor: Graf.CORES.ouro }
      ], { formato: function (v) { return 'R$ ' + Graf.compacto(v); }, unidade: 'R$', altura: 240 }) + '</div>' +
      '<div class="nota">Quando a barra de custo alcança a de preço, o talhão está trabalhando no limite — são os casos de ' +
      esc(c.criticos.length ? c.criticos.join(', ') : 'nenhum talhão') + ' neste período. O custo por unidade usa a produtividade PREVISTA pela IA: se a lavoura render menos, a barra de custo sobe antes mesmo da colheita.</div>');

    c.talhoes.forEach(function (t) {
      var aberto = App4.talhao === t.talhao;
      var cor = t.margemPct >= 25 ? 'verde' : t.margemPct >= 10 ? 'ouro' : 'vermelho';
      html += '<div class="cartao ' + (aberto ? 'destaque' : '') + '" style="margin-top:14px">';
      html += '<div class="flex entre envolve"><h2>' + esc(t.talhao + ' · ' + t.nome) + ' ' + chip(t.produtoRotulo, 'verde') + chip(t.idade + ' anos', 'cinza') + chip(t.sistema, 'azul') + '</h2>' +
        '<div class="flex" style="gap:8px">' + chip('margem ' + pct(t.margemPct, 1), cor) + '<button class="mini sec" onclick="App4.verTalhao(' + (aberto ? 'null' : '\'' + t.talhao + '\'') + ')">' + (aberto ? 'fechar' : 'abrir ficha') + '</button></div></div>';
      html += '<div class="grade g5" style="margin-top:6px">' +
        kpi('Área', num(t.area, 1) + ' ha', esc(t.cultivar)) +
        kpi('Custo direto', brl(t.custoDireto, 0), 'aplicado no talhão') +
        kpi('Rateio da estrutura', brl(t.rateio, 0), 'por área plantada') +
        kpi('Custo por ' + t.unidadeNome, brl(t.custoSacaProjetado, 0), 'projetado com a safra da IA') +
        kpi('Preço de mercado', brl(t.precoMercado, 0), t.precoPremium ? 'lote ' + t.loteRef + ': ' + brl(t.precoPremium, 0) : 'sem lote rastreado') +
        '</div>';
      html += '<div style="margin-top:10px">' + barra(t.progressoSafraPct, 'background:linear-gradient(90deg,var(--verde-500),var(--ouro))') +
        '<div class="nota">' + t.safraRotulo + ': ' + num(t.unidadesRealizadas, 0) + ' de ' + num(t.unidadesPrevistas, 0) + ' ' + esc(t.unidadeNome) + ' colhidos (' + num(t.progressoSafraPct, 0) + '%) — previsão do modelo com ' + num(t.confiancaIA, 0) + '% de confiança</div></div>';

      if (aberto) {
        var fs = E.fechamentoSafra(t.talhao);
        var ev = E.evidenciaSensor(t.talhao);
        html += '<div class="divisor"></div>';
        html += '<div class="grade g2">';
        html += '<div><h3>Composição do custo direto</h3><div class="graf">' +
          Graf.rosca(t.porConta.slice(0, 5).map(function (x) { return { nome: x.nome, valor: x.valor }; }), {
            tamanho: 200, formato: function (v) { return 'R$ ' + Graf.compacto(v); }, centro: 'R$ ' + Graf.compacto(t.custoDireto), centroRotulo: 'custo direto', unidade: 'R$'
          }) + '</div>' +
          t.porConta.slice(0, 6).map(function (x) {
            return '<div class="flex entre" style="padding:3px 0;border-bottom:1px solid var(--linha)"><span class="nota">' + esc(x.codigo + ' ' + x.nome) + '</span><b>' + brl(x.valor, 0) + '</b></div>';
          }).join('') + '</div>';
        html += '<div><h3>Previsão da IA × volume registrado na cadeia</h3>' +
          '<div class="graf">' + Graf.barras([t.safraRotulo], [
            { nome: 'Produção prevista (IA)', dados: [t.unidadesPrevistas || 0], cor: Graf.CORES.especial || Graf.CORES.ia },
            { nome: 'Colhido e registrado', dados: [t.unidadesRealizadas], cor: Graf.CORES.verde }
          ], { formato: function (v) { return num(v, 0); }, unidade: t.unidadeNome, altura: 180, largura: 500 }) + '</div>' +
          '<table class="tabela compacta" style="margin-top:8px"><tbody>' +
          '<tr><td>Produção prevista (IA)</td><td class="num">' + num(t.unidadesPrevistas, 1) + ' ' + esc(t.unidadeNome) + '</td></tr>' +
          '<tr><td>Colhido até agora</td><td class="num">' + num(t.unidadesRealizadas, 1) + ' ' + esc(t.unidadeNome) + '</td></tr>' +
          '<tr><td>Custo por unidade projetado</td><td class="num">' + brl(t.custoSacaProjetado, 2) + '</td></tr>' +
          '<tr><td>Custo por unidade já colhida</td><td class="num">' + brl(t.custoUnitarioParcial, 2) + '</td></tr>' +
          (t.custoUnitarioRealizado ? '<tr><td>Custo por unidade fechado</td><td class="num"><b>' + brl(t.custoUnitarioRealizado, 2) + '</b></td></tr>' : '') +
          '<tr><td>Produtividade prevista</td><td class="num">' + num(t.produtividadePrevista, 1) + ' ' + (t.produto === 'cacau' ? 'kg/ha' : 'sacas/ha') + '</td></tr>' +
          '<tr><td>Produtividade histórica</td><td class="num">' + num(t.produtividadeHistorica, 1) + ' ' + (t.produto === 'cacau' ? 'kg/ha' : 'sacas/ha') + '</td></tr>' +
          '</tbody></table>' + fonte(t.fonte) + '</div>';
        html += '</div>';

        html += '<div class="grade g2" style="margin-top:12px">';
        html += '<div><h3>Fechamento da safra</h3>' +
          '<table class="tabela compacta"><tbody>' +
          '<tr><td>Receita atribuída (volume × preço)</td><td class="num">' + brl(fs.receita, 0) + '</td></tr>' +
          '<tr><td>Custo total do talhão</td><td class="num">' + brl(fs.custoTotal, 0) + '</td></tr>' +
          '<tr class="total"><td>Resultado da safra</td><td class="num">' + brl(fs.resultado, 0) + '</td></tr>' +
          '<tr><td>Margem</td><td class="num">' + pct(fs.margemPct, 1) + '</td></tr>' +
          '<tr><td>Produtividade realizada</td><td class="num">' + num(fs.produtividadeRealizada, 1) + ' ' + (t.produto === 'cacau' ? 'kg/ha' : 'sacas/ha') + '</td></tr>' +
          '<tr><td>Produtividade prevista pela IA</td><td class="num">' + num(fs.produtividadePrevista, 1) + ' ' + (t.produto === 'cacau' ? 'kg/ha' : 'sacas/ha') + '</td></tr>' +
          '</tbody></table>' +
          '<div class="graf" style="margin-top:8px">' + Graf.barras(fs.porMes.map(function (p) { return mesBR(p.mes); }), [
            { nome: 'Volume colhido', dados: fs.porMes.map(function (p) { return p.volumeKg; }), cor: Graf.CORES.cacau }
          ], { formato: function (v) { return Graf.compacto(v); }, unidade: 'kg', altura: 170 }) + '</div>' +
          '<div class="nota">' + esc(fs.comparativoIA ? fs.comparativoIA.leitura : '') + '</div></div>';
        html += '<div><h3>Preço, qualidade e fermentação por lote do talhão</h3>' +
          (ev && ev.lotes.length ? '<table class="tabela compacta"><thead><tr><th>Lote</th><th>Situação</th><th class="num">Nota</th><th class="num">Ajuste</th><th class="num">Preço</th><th class="num">Fermentação</th></tr></thead><tbody>' +
            ev.lotes.map(function (l) {
              return '<tr><td><b>' + esc(l.lote) + '</b><div class="nota">' + num(l.quantidade, 0) + ' ' + esc(l.unidade) + '</div></td>' +
                '<td>' + chip(l.status, 'cinza') + '</td><td class="num">' + num(l.nota, 0) + '</td>' +
                '<td class="num ' + sinal(l.ajustePct) + '">' + (l.ajustePct > 0 ? '+' : '') + num(l.ajustePct, 1) + '%</td>' +
                '<td class="num">' + brl(l.precoAjustado, 2) + '</td>' +
                '<td class="num">' + (l.indiceFermentacao !== null && l.indiceFermentacao !== undefined ? num(l.indiceFermentacao, 0) + ' °C·h<div class="nota">' + esc(l.classeFermentacao || '') + '</div>' : '—') + '</td></tr>';
            }).join('') + '</tbody></table>'
            : '<div class="caixa">Sem lote rastreado neste talhão no período.</div>') + '</div>';
        html += '</div>';

        if (ev) {
          html += '<div class="grade g2" style="margin-top:12px">';
          html += '<div><h3>Evidência de campo: aplicação × medição</h3>' +
            (ev.aplicacoes.length ? '<table class="tabela compacta"><thead><tr><th>Data</th><th>Leitura da janela</th><th class="num">Custo</th><th>Conclusão</th></tr></thead><tbody>' +
              ev.aplicacoes.map(function (a) {
                return '<tr><td>' + dataBR(a.data) + '<div class="nota">' + esc(a.descricao.slice(0, 40)) + '</div></td>' +
                  '<td>' + esc(a.leitura) + '<div class="nota">' + esc(a.fonte) + '</div></td>' +
                  '<td class="num">' + brl(a.valor, 0) + '</td>' +
                  '<td>' + chip(a.justificada ? 'justificada' : 'preventiva', a.justificada ? 'verde' : 'ouro') + '<div class="nota">' + esc(a.conclusao) + '</div></td></tr>';
              }).join('') + '</tbody></table>'
              : '<div class="caixa">Sem aplicação de defensivo no talhão no período.</div>');
          if (ev.irrigacao) {
            html += '<div class="caixa" style="margin-top:9px"><b>Irrigação conferida contra a ET0 medida</b><div class="nota" style="margin-top:5px">' +
              'Lâmina irrigada em 7 dias: ' + num(ev.irrigacao.lamina7d, 1) + ' mm · chuva: ' + num(ev.irrigacao.chuva7d, 1) + ' mm · ET0: ' + num(ev.irrigacao.et0_7d, 1) + ' mm (' + num(ev.irrigacao.coberturaPct, 0) + '% de cobertura) — ' + esc(ev.irrigacao.situacao) +
              '<br>Custo de energia do talhão no período: <b>' + brl(ev.irrigacao.custoEnergia, 0) + '</b>' + (ev.irrigacao.periodoEnergia ? ' (' + esc(ev.irrigacao.periodoEnergia) + ')' : '') + '</div></div>';
          }
          html += '</div>';
          html += '<div><h3>Como o ERP se liga à IA, ao campo e à cadeia</h3>' +
            '<div class="caixa">' +
            '<b>1. Produção</b><div class="nota">Cada colheita registrada na cadeia alimenta o volume do talhão e o custo por saca.</div>' +
            '<b>2. Insumo</b><div class="nota">A baixa de estoque entra no talhão pelo custo médio; a aplicação fica ancorada na cadeia como evento.</div>' +
            '<b>3. Preço</b><div class="nota">O preço de cada venda registrada no ERP é o preço ajustado pela qualidade que o modelo de IA calcula para o lote.</div>' +
            '<b>4. Contabilidade</b><div class="nota">O fechamento do período gera uma raiz de Merkle e é ancorado em bloco, com prova de inclusão conferível.</div>' +
            '</div><div class="nota" style="margin-top:8px">' + esc(ev.resumo) + '</div></div>';
          html += '</div>';
        }
      }
      html += '</div>';
    });
    return html;
  }

   * ESTOQUES

  function brl(v, d) { if (v === null || v === undefined || isNaN(v)) return '—'; return 'R$ ' + num(v, d === undefined ? 0 : d); }
  function pct(v, d) { if (v === null || v === undefined || isNaN(v)) return '—'; return num(v, d === undefined ? 1 : d) + '%'; }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function mesBR(mm) { var p = mm.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][Number(p[1]) - 1] + '/' + p[0].slice(2); }
  function kpiHero(rot, val, obs, cor) {
    return '<div class="cartao"><div class="kpi kpi-hero"><div class="rot">' + rot + '</div>' +
      '<div class="val"' + (cor ? ' style="color:' + cor + '"' : '') + '>' + val + '</div>' +
      (obs ? '<div class="obs">' + obs + '</div>' : '') + '</div></div>';
  }
  function agora() { return new Date(); }
  function hora() { return agora().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  function dataLonga() {
    var d = agora();
    return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  }

  /* =====================================================================
   * ABRIR / FECHAR
   * =================================================================== */
  Imersivo.abrir = function () {
    var el = typeof document !== 'undefined' ? document.getElementById('imersivo') : null;
    if (!el) return;
    el.className = 'imersivo';
    el.setAttribute('aria-hidden', 'false');
    Imersivo.aberto = true;
    el.innerHTML = Imersivo.html();
    if (!Imersivo.instalado) {
      Imersivo.instalado = true;
      if (typeof document !== 'undefined' && document.addEventListener) {
        document.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape' && Imersivo.aberto) Imersivo.fechar();
        });
      }
    }
    if (Imersivo.timer) global.clearInterval(Imersivo.timer);
    Imersivo.timer = global.setInterval(Imersivo.tick, 1000);
  };

  Imersivo.fechar = function () {
    var el = typeof document !== 'undefined' ? document.getElementById('imersivo') : null;
    Imersivo.aberto = false;
    if (Imersivo.timer) { global.clearInterval(Imersivo.timer); Imersivo.timer = null; }
    if (el) { el.className = 'imersivo off'; el.setAttribute('aria-hidden', 'true'); }
  };

  Imersivo.alternar = function () { if (Imersivo.aberto) Imersivo.fechar(); else Imersivo.abrir(); };

  /* A cada segundo: relógio e contadores. A cada 5 s: blocos de campo e mercado. */
  Imersivo.tick = function () {
    if (!Imersivo.aberto) return;
    var el = document.getElementById('im-relogio');
    if (el) el.textContent = hora();
    Imersivo.contador++;
    /* o campo reporta de 15 em 15 minutos: o bloco vivo é recomposto a cada ciclo */
    if (Imersivo.contador % 5 === 0) {
      var vivo = document.getElementById('im-live');
      if (vivo) vivo.innerHTML = blocoCampo();
      var cot = document.getElementById('im-cotacoes');
      if (cot) cot.innerHTML = blocoMercado();
      var seg = document.getElementById('im-segundos');
      if (seg) seg.textContent = num(5 - (Imersivo.contador % 5), 0);
    }
  };

  /* =====================================================================
   * PAINEL
   * =================================================================== */
  Imersivo.html = function () {
    var escopo = E.escopoAtual();
    var ind = E.indicadores();
    var d = E.dre({});
    var fc = E.fluxoCaixa({});
    var c = E.custosConsolidados();
    var al = E.alertas();
    var est = Ledger.estatisticas();
    var pano = IoT.panorama();
    var lotes = E.estoquePorLote({});
    var acumulado = 0;
    var linhaAcum = d.meses.map(function (m) { acumulado += m.resultado; return acumulado; });
    var meses = d.meses.map(function (m) { return mesBR(m.mes); });
    var melhor = c.talhoes.slice().sort(function (a, b) { return (b.margemPct || -999) - (a.margemPct || -999); })[0];

    var html = '';
    html += '<div class="imersivo-topo">' +
      '<div class="logo" style="width:38px;height:38px">' + Ico.svg('semente', 22) + '</div>' +
      '<div><div class="titulo">Acompanhamento em tempo real</div>' +
      '<div class="nota">' + esc(escopo.tipo === 'PROPRIO' ? (escopo.usuario.nome + ' · ' + escopo.usuario.org) : (escopo.usuario.org || escopo.usuario.nome)) + '</div></div>' +
      '<div class="espaco" style="flex:1"></div>' +
      '<span class="relogio" id="im-relogio">' + hora() + '</span>' +
      '<span class="nota">' + esc(dataLonga()) + '</span>' +
      '<span class="chip verde"><span class="pulso"></span>cadeia íntegra · ' + num(est.blocos, 0) + ' blocos</span>' +
      '<span class="chip azul">' + num(pano.total, 0) + ' dispositivos · ' + num(pano.leiturasPorDia, 0) + ' leituras/dia</span>' +
      '<button class="sec mini" onclick="Imersivo.fechar()">sair (Esc)</button>' +
      '</div>';

    /* KPIs hero */
    html += '<div class="grade g4" style="margin:14px 0">' +
      kpiHero('Resultado do período', brl(ind.resultado, 0), d.periodo + ' · margem de ' + pct(ind.margemLiquida), ind.resultado >= 0 ? 'var(--positivo)' : 'var(--negativo)') +
      kpiHero('Receita líquida', brl(ind.receita, 0), 'custo = ' + num(ind.custoPorReal * 100, 0) + '% da receita') +
      kpiHero('Caixa hoje', brl(ind.saldoCaixa, 0), 'a receber ' + brl(ind.aReceber, 0)) +
      kpiHero('Estoque para venda', brl(lotes.reduce(function (a, l) { return a + l.valorMercado; }, 0), 0), lotes.length + ' lotes ao preço da IA') +
      '</div>';

    html += '<div class="vitrine">';
    /* resultado acumulado */
    html += '<div class="cartao"><h2>Resultado acumulado na safra</h2><div class="graf">' +
      Graf.area([{ nome: 'Resultado acumulado', dados: linhaAcum, cor: Graf.CORES.ouro }], {
        altura: 250, formato: function (v) { return 'R$ ' + Graf.compacto(v); }, unidade: 'R$', baseZero: true,
        rotuloX: [meses[0], meses[meses.length - 1]]
      }) + '</div><div class="nota">Saldo do caixa: ' + brl(fc.saldoFinal, 0) + ' · ponto de equilíbrio coberto em ' + pct(ind.pontoEquilibrio.coberturaPct, 0) + '</div></div>';

    /* receita x custo */
    html += '<div class="cartao"><h2>Entradas e saídas mês a mês</h2><div class="graf">' +
      Graf.barras(meses, [
        { nome: 'Entradas', dados: d.meses.map(function (m) { return m.receita; }), cor: Graf.CORES.verde },
        { nome: 'Saídas', dados: d.meses.map(function (m) { return -m.custo; }), cor: Graf.CORES.cacau }
      ], { altura: 250, formato: function (v) { return Graf.compacto(v); }, unidade: 'R$' }) + '</div>' +
      '<div class="nota">O custeio da safra sai antes da colheita; a venda em escrow entra 30 a 60 dias depois.</div></div>';

    /* talhões */
    html += '<div class="cartao"><h2>Talhões: custo por unidade × preço</h2><div class="graf">' +
      Graf.barras(c.talhoes.map(function (t) { return t.talhao + ' ' + t.nome.slice(0, 12); }), [
        { nome: 'Custo por saca/arroba', dados: c.talhoes.map(function (t) { return t.custoSacaProjetado; }), cor: Graf.CORES.cacau },
        { nome: 'Preço de mercado', dados: c.talhoes.map(function (t) { return t.precoMercado; }), cor: Graf.CORES.verde },
        { nome: 'Preço do lote (IA)', dados: c.talhoes.map(function (t) { return t.precoPremium || 0; }), cor: Graf.CORES.ia }
      ], { horizontal: true, altura: Math.max(200, c.talhoes.length * 62 + 60), formato: function (v) { return 'R$ ' + Graf.compacto(v); }, unidade: 'R$' }) + '</div></div>';

    /* margens com anéis */
    html += '<div class="cartao"><h2>Margem por talhão</h2>' + c.talhoes.map(function (t) {
      var p = t.margemPct || 0;
      var cor = p >= 25 ? 'var(--acento)' : p >= 10 ? 'var(--atencao)' : 'var(--critico)';
      return '<div class="flex entre" style="padding:8px 0;border-bottom:1px solid var(--linha)">' +
        '<div style="min-width:0"><b>' + esc(t.talhao + ' · ' + t.nome) + '</b>' +
        '<div class="nota">' + esc(t.produtoRotulo) + ' · ' + num(t.area, 1) + ' ha · custo ' + brl(t.custoSacaProjetado, 0) + ' contra preço ' + brl(t.precoMercado, 0) + '</div></div>' +
        '<div class="flex" style="gap:10px">' + Graf.anel(Math.max(0, Math.min(100, p)), 'margem', { cor: cor }) +
        '<div style="text-align:right"><div class="var ' + (p >= 0 ? 'sobe' : 'desce') + '">' + pct(p, 1) + '</div><div class="nota">' + num(t.progressoSafraPct, 0) + '% colhido</div></div></div></div>';
    }).join('') + '<div class="nota" style="margin-top:9px">Melhor resultado por ' + (melhor ? esc(melhor.unidadeNome) : 'unidade') + ': <b>' + (melhor ? esc(melhor.talhao + ' · ' + melhor.nome) : '—') + '</b> com margem de ' + (melhor ? pct(melhor.margemPct, 1) : '—') + '.</div></div>';

    /* campo ao vivo */
    html += '<div class="cartao" id="im-live" style="grid-column:1/-1">' + blocoCampo() + '</div>';

    /* mercado */
    html += '<div class="cartao" id="im-cotacoes">' + blocoMercado() + '</div>';

    /* cadeia */
    html += '<div class="cartao"><h2>Estado da cadeia</h2>' +
      '<div class="grade g2">' +
      '<div>' + [
        ['Blocos minerados', num(est.blocos, 0)],
        ['Transações registradas', num(est.transacoes, 0)],
        ['Lotes selados', num(est.lotes || (D.lotes.length), 0)],
        ['Contratos em escrow', num(D.contratos.length, 0) + ' (' + brl(D.contratos.reduce(function (a, c) { return a + c.valorTotal; }, 0), 0) + ')'],
        ['Último bloco', '#' + (est.ultimoBloco !== undefined ? est.ultimoBloco : (Ledger.blocos().length - 1))]
      ].map(function (x) {
        return '<div class="flex entre" style="padding:6px 0;border-bottom:1px solid var(--linha)"><span class="nota">' + x[0] + '</span><b>' + x[1] + '</b></div>';
      }).join('') + '</div>' +
      '<div><div class="hash" style="word-break:break-all">' + esc(Ledger.hashCadeia().slice(0, 96)) + '…</div>' +
      '<div class="nota" style="margin-top:8px">Hash da cadeia: qualquer alteração em qualquer bloco muda este valor. ' +
      'A verificação roda a cada bloco minerado e confere hash, encadeamento, Merkle e assinatura de cada transação.</div>' +
      '<div class="flex" style="margin-top:10px;gap:8px"><span class="chip verde">' + num(est.blocos, 0) + ' blocos válidos</span>' +
      '<span class="chip cinza">dificuldade ' + Ledger.DIFICULDADE + '</span>' +
      '<span class="chip roxo">fechamentos ancorados: ' + E.erp().ancoragens.length + '</span></div></div></div></div>';

    /* fechamentos */
    if (E.erp().ancoragens.length) {
      html += '<div class="cartao"><h2>Fechamentos contábeis ancorados</h2>' +
        E.erp().ancoragens.map(function (a) {
          return '<div class="flex entre" style="padding:7px 0;border-bottom:1px solid var(--linha)">' +
            '<div><b>' + esc(a.competencia) + '</b><div class="nota">' + a.contas + ' contas · bloco #' + a.bloco + '</div></div>' +
            '<div style="text-align:right"><div class="' + (a.resultado >= 0 ? 'positivo' : 'negativo') + '"><b>' + brl(a.resultado, 0) + '</b></div>' +
            '<div class="hash">' + esc(a.raizMerkle.slice(0, 20)) + '…</div></div></div>';
        }).join('') + '</div>';
    }
    html += '</div>';

    /* alertas em faixa */
    html += '<div class="ticker" style="margin-top:14px">' +
      '<span class="chip ' + (al.criticos ? 'vermelho' : 'verde') + '">' + al.resumo + '</span>' +
      al.itens.slice(0, 5).map(function (a) {
        return '<span>' + '<span class="sev ' + (a.severidade === 'critico' ? 'critico' : a.severidade === 'atencao' ? 'atencao' : 'info') + '"></span>' + esc(a.area + ': ' + a.titulo) + '</span>';
      }).join('') + '</div>';
    html += '<div class="flex entre" style="margin-top:10px"><span class="nota">Próximo ciclo de leitura de campo em <b id="im-segundos">5</b> s · leituras de 15 em 15 minutos, agregadas por hora</span>' +
      '<span class="nota">AgroChain · modo imersivo · Esc para sair</span></div>';
    return html;
  };

  /* =====================================================================
   * BLOCO AO VIVO — o que o campo está medindo
   * =================================================================== */
  function blocoCampo() {
    var panorama = IoT.panorama();
    var html = '<h2>No campo, agora <span class="sub">últimas leituras dos dispositivos ativos</span></h2>';
    var escopo = E.escopoAtual();
    var talhoes = D.talhoes.filter(function (t) { return escopo.produtores.indexOf(t.produtor) >= 0; });
    html += '<div class="grade g3">';
    talhoes.forEach(function (t) {
      var d = IoT.derivadosTalhao(t.id);
      var sensores = IoT.sensoresDeTalhao(t.id);
      var solo = d.estresse || null;
      var linhas = [];
      linhas.push('<div class="flex entre" style="padding:4px 0"><span class="nota">Água disponível no solo</span><b>' + (solo && solo.aguaDisponivel !== undefined ? num(solo.aguaDisponivel, 0) + '% · ' + esc(solo.classificacao) : '—') + '</b></div>');
      if (d.balanco) linhas.push('<div class="flex entre" style="padding:4px 0"><span class="nota">Balanço hídrico (30 d)</span><b class="' + (d.balanco.saldo >= 0 ? 'positivo' : 'negativo') + '">' + num(d.balanco.saldo, 1) + ' mm</b></div>');
      if (d.grausDia) linhas.push('<div class="flex entre" style="padding:4px 0"><span class="nota">Graus-dia acumulados</span><b>' + num(d.grausDia.acumulado30d, 0) + ' GD · ' + esc(d.grausDia.estagio) + '</b></div>');
      if (d.molhamento) linhas.push('<div class="flex entre" style="padding:4px 0"><span class="nota">Molhamento foliar (7 d)</span><b>' + num(d.molhamento.horasFavoraveis, 0) + ' h favoráveis</b></div>');
      html += '<div class="caixa">' +
        '<div class="flex entre"><b>' + esc(t.id + ' · ' + t.nome) + '</b><span class="chip ' + (sensores.length ? 'azul' : 'cinza') + '">' + sensores.length + ' dispositivo(s)</span></div>' +
        '<div class="nota">' + esc(t.produto === 'cacau' ? 'Cacau' : 'Café conilon') + ' · ' + num(t.area, 1) + ' ha · ' + esc(t.sistema) + '</div>' +
        '<div style="margin-top:6px">' + linhas.join('') + '</div>' +
        '</div>';
    });
    /* fermentação e secagem com gráfico */
    var lojas = D.lotes.filter(function (l) {
      return escopo.produtores.indexOf(l.produtor) >= 0 && (l.status === 'EM_FERMENTACAO' || l.status === 'EM_SECAGEM');
    });
    lojas.forEach(function (l) {
      if (l.produto === 'cacau' && l.status === 'EM_FERMENTACAO') {
        var f = IoT.fermentacao(l.id);
        if (!f) return;
        var serieF = f.serie.map(function (x) { return x.valores.tempMassa; });
        html += '<div class="caixa"><div class="flex entre"><b>Massa de cacau ' + esc(l.id) + '</b>' +
          '<span class="chip ' + (f.classe === 'ideal' ? 'verde' : f.classe === 'excesso' ? 'vermelho' : 'ouro') + '">' + esc(f.classe) + ' · ' + esc(f.situacao || 'em andamento') + '</span></div>' +
          '<div class="kpi" style="margin:6px 0"><div class="val" style="font-size:26px">' + num(f.indiceAcumulado, 0) + ' <span style="font-size:14px">°C·h</span></div>' +
          '<div class="obs">pico de ' + num(f.temperaturaPico, 1) + ' °C em ' + num(f.picoAtingidoEmHoras, 0) + ' h · nota prevista ' + num(f.notaPrevista, 0) + '</div></div>' +
          '<div class="graf">' + Graf.linha([{ nome: 'Temperatura da massa', dados: serieF, cor: Graf.CORES.ia }], {
            altura: 120, formato: function (v) { return num(v, 1) + ' °C'; }, unidade: '°C',
            faixas: [{ de: 40, ate: 52, nome: 'acima de 40 °C o calor conta para o índice', cor: 'rgba(107,79,168,.14)' }]
          }) + '</div>' +
          '<div class="nota">' + esc(f.recomendacao || '') + '</div></div>';
      } else if (l.produto === 'cafe_conilon' || l.status === 'EM_SECAGEM') {
        var s = IoT.secagem(l.id);
        if (!s) return;
        var serieS = s.serie.map(function (x) { return x.valores.umidadeGrao; });
        html += '<div class="caixa"><div class="flex entre"><b>Secagem do lote ' + esc(l.id) + '</b>' +
          '<span class="chip ' + (s.concluida ? 'verde' : 'azul') + '">' + (s.concluida ? 'no ponto' : 'em andamento') + '</span></div>' +
          '<div class="kpi" style="margin:6px 0"><div class="val" style="font-size:26px">' + num(s.umidadeAtual, 1) + ' <span style="font-size:14px">% umidade</span></div>' +
          '<div class="obs">meta ' + num(s.umidadeAlvo, 1) + '% a ' + num(s.taxaDesidratacaoDia, 2) + '%/dia · ' +
          (s.diasParaPontoIdeal === null ? 'taxa insuficiente para prever o ponto' : num(s.diasParaPontoIdeal, 1) + ' dia(s) para o ponto') + '</div></div>' +
          '<div class="graf">' + Graf.linha([{ nome: 'Umidade do grão', dados: serieS, cor: Graf.CORES.agua }], {
            altura: 120, formato: function (v) { return num(v, 1) + '%'; }, unidade: '%',
            faixas: [{ de: s.umidadeAlvo - 0.4, ate: s.umidadeAlvo + 0.4, nome: 'umidade de entrega', cor: 'rgba(201,162,39,.18)' }]
          }) + '</div>' +
          (s.alerta ? '<div class="nota">' + esc(s.alerta) + '</div>' : '') + '</div>';
      }
    });
    html += '</div>';
    html += '<div class="nota" style="margin-top:9px">Sensores: ' + num(panorama.total, 0) + ' cadastrados, ' + num(panorama.ativos, 0) + ' ativos, ' + num(panorama.confiabilidadeMedia, 0) + '% de confiabilidade · bateria média ' + num(panorama.bateriaMedia, 0) + '%. ' +
      'As leituras são agregadas de hora em hora e a massa de cacau reporta a cada 15 minutos — é isso que dá base para justificar cada aplicação e cada lote.</div>';
    return html;
  }

  function blocoMercado() {
    var cot = [
      { produto: 'cafe_arabica', nome: 'Café arábica', unidade: 'saca 60 kg', cor: Graf.CORES.verde },
      { produto: 'cafe_conilon', nome: 'Café conilon', unidade: 'saca 60 kg', cor: Graf.CORES.ouro },
      { produto: 'cacau', nome: 'Cacau', unidade: 'kg', cor: Graf.CORES.cacau }
    ];
    var html = '<h2>Cotações e mercado <span class="sub">Cepea/Esalq e praças de Rondônia</span></h2><div class="grade g3">';
    cot.forEach(function (c) {
      var serie = D.precos[c.produto];
      var valores = serie.map(function (p) { return p.preco; });
      var atual = valores[valores.length - 1];
      var antes = valores[Math.max(0, valores.length - 31)];
      var varPct = (atual - antes) / antes * 100;
      html += '<div class="caixa"><div class="flex entre"><b>' + esc(c.nome) + '</b>' +
        '<span class="var ' + (varPct >= 0 ? 'sobe' : 'desce') + '">' + (varPct >= 0 ? '▲' : '▼') + ' ' + pct(Math.abs(varPct), 1) + '</span></div>' +
        '<div class="kpi" style="margin:4px 0"><div class="val" style="font-size:24px">' + brl(atual, 2) + '</div><div class="obs">por ' + esc(c.unidade) + ' · 30 dias</div></div>' +
        Graf.sparkline(valores.slice(-60), { largura: 240, altura: 40, cor: c.cor }) + '</div>';
    });
    html += '</div>';
    var lotes = E.estoquePorLote({});
    if (lotes.length) {
      html += '<div style="margin-top:12px;overflow-x:auto"><table class="tabela compacta"><thead><tr><th>Lote</th><th class="num">Saldo</th><th class="num">Custo</th><th class="num">Preço da IA</th><th class="num">Resultado</th></tr></thead><tbody>' +
        lotes.map(function (l) {
          return '<tr><td><b>' + esc(l.lote) + '</b><div class="nota">' + esc(l.produtoRotulo) + ' · nota ' + num(l.notaQualidade, 0) + '</div></td>' +
            '<td class="num">' + num(l.saldo, 0) + ' ' + esc(String(l.unidade).split(' ')[0]) + '</td>' +
            '<td class="num">' + brl(l.custoUnit, 0) + '</td><td class="num">' + brl(l.precoIA, 0) + '</td>' +
            '<td class="num ' + (l.resultado >= 0 ? 'positivo' : 'negativo') + '"><b>' + brl(l.resultado, 0) + '</b></td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    return html;
  }

  global.Imersivo = Imersivo;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ============ INICIALIZAÇÃO ============ */
(function(){
  function subir(){
    try{ App.iniciar(); }
    catch(e){
      var alvo = document.getElementById('app');
      if(alvo){ alvo.innerHTML = '<div style="padding:40px;font-family:monospace;color:#ff9c8c">'+
        '<h2>Falha ao iniciar o AgroChain</h2><p>'+ (e && e.message ? e.message : e) +'</p>'+
        '<pre style="white-space:pre-wrap;color:#c8d1d8;margin-top:10px">'+ (e && e.stack ? e.stack : '') +'</pre></div>'; }
      throw e;
    }
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', subir); } else { subir(); }
})();
</script>
</body>
</html>
